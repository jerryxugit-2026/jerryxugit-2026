<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AI: build the tools, count the cost">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#D0D7DE" stroke-width="2"/>

  <text x="80" y="140" font-family="Menlo,Consolas,'Courier New',monospace" font-size="22" letter-spacing="8" fill="#57606A">AI &#183; TOOLING</text>
  <text x="80" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#24292F">Build the tools, count the cost</text>
  <text x="80" y="260" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" fill="#57606A">A study tool, agent infrastructure &#8212; and the honest cost of automation</text>

  <rect x="80" y="306" width="1040" height="248" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="108" y="344" font-family="Menlo,Consolas,'Courier New',monospace" font-size="23" fill="#6E7781">@@ what I keep rebuilding @@</text>

  <rect x="82" y="356" width="1036" height="44" fill="#FFEBE9"/>
  <text x="108" y="385" font-family="Menlo,Consolas,'Courier New',monospace" font-size="25" fill="#82071E">-   memorize someone else's word list</text>
  <rect x="82" y="400" width="1036" height="44" fill="#E6FFEC"/>
  <text x="108" y="429" font-family="Menlo,Consolas,'Courier New',monospace" font-size="25" fill="#116329">+   study the words your own textbook uses</text>
  <rect x="82" y="444" width="1036" height="44" fill="#FFEBE9"/>
  <text x="108" y="473" font-family="Menlo,Consolas,'Courier New',monospace" font-size="25" fill="#82071E">-   assume the automation is free</text>
  <rect x="82" y="488" width="1036" height="44" fill="#E6FFEC"/>
  <text x="108" y="517" font-family="Menlo,Consolas,'Courier New',monospace" font-size="25" fill="#116329">+   count what it costs in entry-level work</text>
  <rect x="766" y="496" width="12" height="28" fill="#116329">
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
