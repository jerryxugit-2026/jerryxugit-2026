<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="PiMoa: when one model is not enough">
  <rect width="1200" height="630" fill="#EEF2F7"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <text x="80" y="140" font-family="Menlo,Consolas,'Courier New',monospace" font-size="22" letter-spacing="8" fill="#2F5BEA">AI &#183; TOOLING</text>
  <text x="80" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#16233D">When one model is not enough</text>
  <text x="80" y="258" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" fill="#4A5A72">several models argue before anything counts</text>
  <text x="80" y="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#7A8AA3">Blind proposals &#183; a referee &#183; a sandbox that cannot touch your disk</text>

  <defs>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#2F5BEA"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#2F8F5B"/>
    </marker>
  </defs>

  <!-- ============ 汇聚式评审图 ============ -->
  <!-- 只读沙箱 -->
  <rect x="80" y="366" width="400" height="152" rx="12" fill="#E3EAF6" stroke="#2F5BEA" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="104" y="392" font-family="Menlo,Consolas,'Courier New',monospace" font-size="14" fill="#2F5BEA">READ-ONLY SANDBOX</text>

  <g font-family="Menlo,Consolas,'Courier New',monospace" font-size="15" fill="#FFFFFF">
    <rect x="104" y="404" width="176" height="30" rx="6" fill="#2F5BEA"/><text x="118" y="424">Proposer A</text>
    <rect x="104" y="442" width="176" height="30" rx="6" fill="#2F5BEA"/><text x="118" y="462">Proposer B</text>
    <rect x="104" y="480" width="176" height="30" rx="6" fill="#2F5BEA"/><text x="118" y="500">Proposer C</text>
  </g>

  <!-- 汇聚线 -->
  <g stroke="#2F5BEA" stroke-width="2" fill="none" opacity="0.65">
    <path d="M288 419 L392 442"/>
    <path d="M288 457 L392 442"/>
    <path d="M288 495 L392 442"/>
  </g>
  <path d="M400 442 L470 442" stroke="#2F5BEA" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/>

  <!-- 裁判 -->
  <rect x="520" y="396" width="204" height="94" rx="12" fill="#16233D"/>
  <text x="622" y="438" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">referee</text>
  <text x="622" y="468" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A9B6CC">follows the evidence</text>

  <path d="M726 442 L788 442" stroke="#2F8F5B" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>

  <!-- 结论 -->
  <rect x="796" y="396" width="204" height="94" rx="12" fill="#2F8F5B"/>
  <text x="898" y="438" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">verdict</text>
  <text x="898" y="468" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#CDEBD8">file + line, or nothing</text>

  <!-- 右侧注解 -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">
    <text x="1112" y="410" font-size="19" fill="#4A5A72">no network</text>
    <text x="1112" y="438" font-size="19" fill="#4A5A72">no writes</text>
    <text x="1112" y="466" font-size="19" fill="#4A5A72">no keys</text>
    <text x="1112" y="500" font-size="15" fill="#7A8AA3">fail closed</text>
  </g>

  <text x="80" y="578" font-family="Menlo,Consolas,'Courier New',monospace" font-size="18" fill="#7A8AA3">TypeScript / Node &#183; 381 tests &#183; macOS sandbox</text>
</svg>
