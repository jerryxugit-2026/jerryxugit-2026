<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Research-AI-and-Employment: the entry level, automated">
  <rect width="1200" height="630" fill="#12141C"/>
  <g stroke="#2A2E3C" stroke-width="1.5" fill="none">
    <path d="M40 72 V40 H72"/>
    <path d="M1128 40 H1160 V72"/>
    <path d="M40 558 V590 H72"/>
    <path d="M1128 590 H1160 V558"/>
  </g>

  <text x="80" y="140" font-family="Menlo,Consolas,'Courier New',monospace" font-size="22" letter-spacing="8" fill="#FF6B6B">AI &#183; THE COST</text>
  <text x="80" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#F2F4F8">The entry level, automated</text>
  <text x="80" y="258" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" fill="#9AA3B5">why the economy can grow while the entry rung disappears</text>
  <text x="80" y="302" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#6B7280">A working paper &#8212; output growth and structural unemployment can coexist</text>

  <!-- ============ 双线分歧图 ============ -->
  <!-- 坐标轴 -->
  <g stroke="#3A4052" stroke-width="2">
    <line x1="120" y1="510" x2="1080" y2="510"/>
    <line x1="120" y1="360" x2="120" y2="510"/>
  </g>
  <g stroke="#2A2E3C" stroke-width="1" stroke-dasharray="3 6">
    <line x1="120" y1="435" x2="1080" y2="435"/>
    <line x1="120" y1="390" x2="1080" y2="390"/>
    <line x1="120" y1="480" x2="1080" y2="480"/>
  </g>

  <!-- 产出/生产率：持平上行 -->
  <path d="M120 420 C 300 412, 420 406, 560 400 S 860 386, 1080 378"
        fill="none" stroke="#4ECDC4" stroke-width="4"/>
  <!-- 入门岗位：下滑 -->
  <path d="M120 420 C 300 432, 430 452, 560 470 S 880 500, 1080 508"
        fill="none" stroke="#FF6B6B" stroke-width="4"/>

  <!-- 端点标签 -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="1064" y="366" text-anchor="end" font-size="19" fill="#4ECDC4">output &amp; productivity</text>
    <text x="1064" y="536" text-anchor="end" font-size="19" fill="#FF6B6B">entry-level openings</text>
    <text x="120" y="352" font-size="15" fill="#6B7280">the good macro outcome</text>
    <text x="120" y="546" font-size="15" fill="#6B7280">and the people on the bottom rung</text>
  </g>

  <!-- 分歧标注 -->
  <g font-family="Menlo,Consolas,'Courier New',monospace" font-size="15" fill="#8A93A6">
    <line x1="700" y1="392" x2="700" y2="500" stroke="#8A93A6" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="712" y="452">they diverge</text>
  </g>

  <text x="80" y="578" font-family="Menlo,Consolas,'Courier New',monospace" font-size="18" fill="#5A6272">Working paper &#183; May 2026 &#183; sole author &#183; not submitted</text>
</svg>
