<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Society: when a system fails, who absorbs it — a resilience index for 20 cities">
  <rect width="1200" height="630" fill="#0B1526"/>

  <text x="80" y="140" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" letter-spacing="8" fill="#F5B942">SOCIETY</text>
  <text x="80" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#EDE9DC">When a system fails, who absorbs it</text>
  <text x="80" y="260" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" fill="#93A0B8">A 15-indicator resilience index for 20 cities, forecast to 2029</text>

  <defs>
    <pattern id="win" width="24" height="28" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="6" height="9" fill="#F5B942" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="15" y="18" width="6" height="9" fill="#F5B942" opacity="0.28">
        <animate attributeName="opacity" values="0.28;0.1;0.28" dur="5s" repeatCount="indefinite"/>
      </rect>
    </pattern>
    <g id="blds">
      <rect x="80" y="370" width="70" height="150"/>
      <rect x="158" y="300" width="55" height="220"/>
      <rect x="221" y="400" width="80" height="120"/>
      <rect x="309" y="285" width="60" height="235"/>
      <rect x="377" y="340" width="90" height="180"/>
      <rect x="475" y="305" width="65" height="215"/>
      <rect x="548" y="380" width="75" height="140"/>
      <rect x="631" y="290" width="58" height="230"/>
      <rect x="697" y="330" width="85" height="190"/>
      <rect x="858" y="360" width="78" height="160"/>
      <rect x="944" y="280" width="62" height="240"/>
      <rect x="1014" y="390" width="70" height="130"/>
      <rect x="1092" y="320" width="28" height="200"/>
    </g>
  </defs>
  <use href="#blds" xlink:href="#blds" fill="#141F39"/>
  <use href="#blds" xlink:href="#blds" fill="url(#win)"/>
  <rect x="790" y="285" width="60" height="235" fill="#0E1830" stroke="#F5B942" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.35"/>
  <rect x="80" y="520" width="1040" height="2" fill="#F5B942" opacity="0.5"/>

  <line x1="80" y1="578" x2="1120" y2="578" stroke="#33405C" stroke-width="2"/>
  <g stroke="#7A86A0" stroke-width="2">
    <line x1="80" y1="572" x2="80" y2="584"/>
    <line x1="154.3" y1="572" x2="154.3" y2="584"/>
    <line x1="228.6" y1="572" x2="228.6" y2="584"/>
    <line x1="302.9" y1="572" x2="302.9" y2="584"/>
    <line x1="377.1" y1="572" x2="377.1" y2="584"/>
    <line x1="451.4" y1="572" x2="451.4" y2="584"/>
    <line x1="525.7" y1="572" x2="525.7" y2="584"/>
    <line x1="600" y1="572" x2="600" y2="584"/>
    <line x1="674.3" y1="572" x2="674.3" y2="584"/>
    <line x1="748.6" y1="572" x2="748.6" y2="584"/>
    <line x1="822.9" y1="572" x2="822.9" y2="584"/>
    <line x1="897.1" y1="572" x2="897.1" y2="584"/>
    <line x1="971.4" y1="572" x2="971.4" y2="584"/>
    <line x1="1045.7" y1="572" x2="1045.7" y2="584"/>
    <line x1="1120" y1="572" x2="1120" y2="584"/>
  </g>
  <text x="80" y="608" font-family="Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#7A86A0">15 indicators</text>
  <text x="1120" y="608" text-anchor="end" font-family="Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#7A86A0">climate &#183; health &#183; economy</text>
</svg>
